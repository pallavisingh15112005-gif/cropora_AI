name: Update mandi prices

on:
  schedule:
    # Every day at 04:30 UTC (10:00 IST). Agmarknet publishes once a day.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest mandi prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python3 data/fetch_mandi.py

      - name: Send price alerts via backend
        # Runs only when BACKEND_URL and CRON_SECRET secrets are set.
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Backend not configured. Skipping alerts."
            exit 0
          fi
          curl -sS --fail -X POST "$BACKEND_URL/api/check" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-binary @data/prices.json

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No change in prices."
          else
            git commit -m "Update mandi prices $(date -u +%Y-%m-%d)"
            git push
          fi
